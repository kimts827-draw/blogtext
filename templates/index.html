<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>블로그 텍스트 추출기</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; background: #f4f4f9; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { width: 80%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; }
        button { padding: 12px 24px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        textarea { width: 100%; height: 400px; margin-top: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 6px; resize: none; font-size: 14px; line-height: 1.6; }
        .loading { color: #666; display: none; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>블로그 텍스트 추출기</h2>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="blogUrl" placeholder="추출할 블로그 URL을 입력하세요">
            <button onclick="fetchText()">추출하기</button>
        </div>
        <p id="loading" class="loading">텍스트를 분석 중입니다...</p>
        <textarea id="result" placeholder="결과가 여기에 표시됩니다."></textarea>
        <button onclick="copyText()" style="background: #28a745; margin-top: 10px;">결과 복사하기</button>
    </div>

    <script>
        async function fetchText() {
            const url = document.getElementById('blogUrl').value;
            const resultArea = document.getElementById('result');
            const loading = document.getElementById('loading');

            if(!url) return alert("URL을 입력하세요.");

            loading.style.display = 'block';
            resultArea.value = '';

            try {
                const response = await fetch('/extract', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });
                
                const data = await response.json();
                
                // undefined 방지 처리: data.text가 있으면 쓰고, 없으면 error 출력, 둘 다 없으면 메시지 출력
                resultArea.value = data.text || data.error || "결과를 가져오지 못했습니다.";
                
            } catch (e) {
                resultArea.value = "서버와 통신하는 중 에러가 발생했습니다.";
                console.error(e);
            } finally {
                loading.style.display = 'none';
            }
        }

        function copyText() {
            const resultArea = document.getElementById('result');
            resultArea.select();
            document.execCommand('copy');
            alert('복사되었습니다!');
        }
    </script>
</body>
</html>
